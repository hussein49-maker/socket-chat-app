<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0907">
    <title>Flame Realm - Secure E2EE Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <!-- Shared icon sprites -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="icon-flame" viewBox="0 0 24 24">
            <path d="M12.6 1.8c.6 3.6-1.3 5.5-3.1 7.5C7.7 11.3 6 13.2 6 16a6 6 0 0 0 12 0c0-2.3-.9-4-2.1-5.5-.3 1.3-.9 2.2-1.9 2.9.4-3.9-.2-8.200-1.4-11.6z"/>
        </symbol>
        <symbol id="icon-lock" viewBox="0 0 24 24">
            <path d="M17 9V7A5 5 0 0 0 7 7v2a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-6a3 3 0 0 0-3-3zM9 7a3 3 0 0 1 6 0v2H9zm4 9.7V18a1 1 0 0 1-2 0v-1.300a2 2 0 1 1 2 0z"/>
        </symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24">
            <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0v-1a1 1 0 0 1 1-1zM2 12a1 1 0 0 1 1-1h1a1 1 0 0 1 0 2H3a1 1 0 0 1-1-1zm17 0a1 1 0 0 1 1-1h1a1 1 0 0 1 0 2h-1a1 1 0 0 1-1-1zM4.900 4.900a1 1 0 0 1 1.400 0l.700.700a1 1 0 0 1-1.400 1.400l-.700-.700a1 1 0 0 1 0-1.400zm12.100 12.100a1 1 0 0 1 1.400 0l.700.700a1 1 0 0 1-1.400 1.400l-.700-.700a1 1 0 0 1 0-1.400zM4.900 19.100a1 1 0 0 1 0-1.400l.700-.700a1 1 0 0 1 1.400 1.400l-.700.700a1 1 0 0 1-1.400 0zM17 7a1 1 0 0 1 0-1.400l.700-.700a1 1 0 0 1 1.400 1.400l-.700.700A1 1 0 0 1 17 7z"/>
        </symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24">
            <path d="M20.500 14.600A8.500 8.500 0 0 1 9.400 3.500a1 1 0 0 0-1.300-1.200A10 10 0 1 0 21.700 15.900a1 1 0 0 0-1.200-1.300z"/>
        </symbol>
        <symbol id="icon-send" viewBox="0 0 24 24">
            <path d="M3.400 20.400 21 12.900a1 1 0 0 0 0-1.800L3.400 3.600a1 1 0 0 0-1.400 1.100L3.800 11l9.200 1-9.200 1L2 19.300a1 1 0 0 0 1.400 1.100z"/>
        </symbol>
        <symbol id="icon-palette" viewBox="0 0 24 24">
            <path d="M12 2a10 10 0 0 0 0 20h1.500a2.500 2.500 0 0 0 1.870-4.160c-.480-.540-.100-1.340.620-1.340H18a4 4 0 0 0 4-4C22 6.480 17.520 2 12 2zM6.500 13a1.500 1.500 0 1 1 0-3 1.500 1.500 0 0 1 0 3zm3-4.500a1.500 1.500 0 1 1 0-3 1.500 1.500 0 0 1 0 3zm5 0a1.500 1.500 0 1 1 0-3 1.500 1.500 0 0 1 0 3zm3 4.500a1.500 1.500 0 1 1 0-3 1.500 1.500 0 0 1 0 3z"/>
        </symbol>
        <symbol id="icon-mic" viewBox="0 0 24 24">
            <path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a1 1 0 0 1 2 0 8 8 0 0 1-7 7.900V21h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-2.100A8 8 0 0 1 4 11a1 1 0 0 1 2 0 6 6 0 0 0 12 0z"/>
        </symbol>
        <symbol id="icon-play" viewBox="0 0 24 24">
            <path d="M8.200 4.300A1.500 1.500 0 0 0 6 5.600v12.800a1.500 1.500 0 0 0 2.200 1.300l11.200-6.400a1.500 1.500 0 0 0 0-2.600z"/>
        </symbol>
        <symbol id="icon-pause" viewBox="0 0 24 24">
            <path d="M8 4a2 2 0 0 1 2 2v12a2 2 0 0 1-4 0V6a2 2 0 0 1 2-2zm8 0a2 2 0 0 1 2 2v12a2 2 0 0 1-4 0V6a2 2 0 0 1 2-2z"/>
        </symbol>
        <symbol id="icon-exit" viewBox="0 0 24 24">
            <path d="M10 3a1 1 0 0 1 0 2H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4a1 1 0 0 1 0 2H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zm5.300 4.300a1 1 0 0 1 1.400 0l4 4a1 1 0 0 1 0 1.400l-4 4a1 1 0 0 1-1.400-1.400l2.300-2.300H9a1 1 0 0 1 0-2h8.600l-2.300-2.300a1 1 0 0 1 0-1.400z"/>
        </symbol>
    </svg>

    <canvas id="particles-canvas"></canvas>

    <!-- ============ Login ============ -->
    <main id="login-screen" class="card-container login-card screen-enter">
        <div class="login-top-actions">
            <button type="button" class="icon-btn bg-btn" onclick="toggleBgMenu(event)" aria-label="Change background" title="Change background">
                <svg class="icon"><use href="#icon-palette"/></svg>
            </button>
            <button type="button" class="icon-btn theme-toggle" onclick="toggleTheme()" aria-label="Switch to light mode" title="Toggle theme">
                <svg class="icon icon-sun"><use href="#icon-sun"/></svg>
                <svg class="icon icon-moon"><use href="#icon-moon"/></svg>
            </button>
        </div>

        <div class="brand">
            <div class="brand-mark"><svg class="icon"><use href="#icon-flame"/></svg></div>
            <h1 class="brand-title">Flame Realm</h1>
            <p class="brand-tagline">Private rooms that burn after reading.</p>
        </div>

        <form class="login-form" onsubmit="handleConnectWithAnimation(event); return false;" novalidate>
            <div class="role-selector" role="radiogroup" aria-label="Role">
                <label class="radio-label">
                    <input type="radio" name="role" value="server" checked onclick="toggleRoleInputs()">
                    <span>Server</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="role" value="client" onclick="toggleRoleInputs()">
                    <span>Client</span>
                </label>
            </div>

            <div class="input-group">
                <label class="field">
                    <span class="field-label">Username</span>
                    <input type="text" id="username-input" placeholder="e.g. Kyojuro" autocomplete="off" maxlength="24">
                </label>
                <div class="field-row">
                    <label class="field field-grow">
                        <span class="field-label">IP address</span>
                        <input type="text" id="ip-input" value="127.0.0.1" placeholder="127.0.0.1" inputmode="decimal" autocomplete="off">
                    </label>
                    <label class="field field-port">
                        <span class="field-label">Port</span>
                        <input type="text" id="port-input" value="8765" placeholder="8765" inputmode="numeric" autocomplete="off">
                    </label>
                </div>
            </div>

            <button type="submit" class="animated-btn flame-btn">
                <svg class="icon"><use href="#icon-flame"/></svg>
                <span>Ignite</span>
            </button>

            <div id="error-message" class="error-msg hidden" role="alert"></div>
        </form>

        <ul class="trust-list">
            <li><svg class="icon"><use href="#icon-lock"/></svg> Encrypted in your browser</li>
            <li><svg class="icon"><use href="#icon-flame"/></svg> Wiped when the room empties</li>
        </ul>
    </main>

    <!-- ============ Chat ============ -->
    <main id="chat-screen" class="card-container hidden">
        <header class="chat-header">
            <div class="header-status">
                <div class="brand-mark brand-mark-sm"><svg class="icon"><use href="#icon-flame"/></svg></div>
                <div class="header-text">
                    <h2 class="room-title">Flame Realm</h2>
                    <p class="room-subtitle">
                        <span class="status-dot"></span>
                        <span id="room-subtitle">Connected</span>
                    </p>
                </div>
            </div>
            <div class="header-actions">
                <span class="e2ee-badge" title="Messages are encrypted before they leave your browser">
                    <svg class="icon"><use href="#icon-lock"/></svg> E2EE
                </span>
                <button type="button" class="icon-btn bg-btn" onclick="toggleBgMenu(event)" aria-label="Change background" title="Change background">
                    <svg class="icon"><use href="#icon-palette"/></svg>
                </button>
                <button type="button" class="icon-btn theme-toggle" onclick="toggleTheme()" aria-label="Switch to light mode" title="Toggle theme">
                    <svg class="icon icon-sun"><use href="#icon-sun"/></svg>
                    <svg class="icon icon-moon"><use href="#icon-moon"/></svg>
                </button>
                <button type="button" class="leave-btn" onclick="disconnect()">
                    <svg class="icon"><use href="#icon-exit"/></svg>
                    <span>Leave</span>
                </button>
            </div>
        </header>

        <div class="anime-characters-bar">
            <button type="button" class="char-card rengoku-card" onclick="triggerCharFX(event, 'rengoku')">
                <span class="char-avatar">🔥</span>
                <span class="char-name">Kyojuro</span>
            </button>
            <button type="button" class="char-card tanjiro-card" onclick="triggerCharFX(event, 'tanjiro')">
                <span class="char-avatar">🌊</span>
                <span class="char-name">Tanjiro</span>
            </button>
            <div id="anime-quote" class="anime-quote-box"></div>
        </div>

        <div id="chat-messages" role="log" aria-live="polite" data-empty="No messages yet. Light the first spark."></div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="Set your heart ablaze..." onkeypress="checkEnter(event)" autocomplete="off" aria-label="Message">
            <button type="button" id="mic-btn" class="mic-btn" onclick="toggleRecording(event)" aria-label="Record voice note" title="Record an encrypted voice note">
                <svg class="icon"><use href="#icon-mic"/></svg>
            </button>
            <button type="button" class="animated-btn flame-btn send-btn" onclick="sendMessageWithFX(event)" aria-label="Send message">
                <svg class="icon"><use href="#icon-send"/></svg>
            </button>
        </div>
    </main>

    <div id="bg-menu" class="bg-menu" role="menu" aria-label="Background">
        <div class="bg-menu-title">Background</div>
        <button type="button" class="bg-chip" data-bg="embers" aria-pressed="true" onclick="selectBackground('embers', event)"><span class="bg-dot bg-dot-embers"></span>Embers <small>rising sparks</small></button>
        <button type="button" class="bg-chip" data-bg="galaxy" aria-pressed="false" onclick="selectBackground('galaxy', event)"><span class="bg-dot bg-dot-galaxy"></span>Galaxy <small>twinkling stars</small></button>
        <button type="button" class="bg-chip" data-bg="ocean" aria-pressed="false" onclick="selectBackground('ocean', event)"><span class="bg-dot bg-dot-ocean"></span>Ocean <small>drifting bubbles</small></button>
        <button type="button" class="bg-chip" data-bg="sakura" aria-pressed="false" onclick="selectBackground('sakura', event)"><span class="bg-dot bg-dot-sakura"></span>Sakura <small>falling petals</small></button>
        <button type="button" class="bg-chip" data-bg="matrix" aria-pressed="false" onclick="selectBackground('matrix', event)"><span class="bg-dot bg-dot-matrix"></span>Matrix <small>digital rain</small></button>
    </div>

    <script src="app.js"></script>
</body>
</html>
